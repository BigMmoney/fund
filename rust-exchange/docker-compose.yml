version: "3.9"

services:
  exchange:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    ports:
      - "3030:3030"
    volumes:
      - exchange-data:/app/data
      - ./config:/app/config:ro
      - ./secrets:/run/secrets/exchange:ro
    environment:
      RUST_LOG: "info"
      API_BIND_HOST: "0.0.0.0"
      API_BIND_PORT: "3030"
      EXCHANGE_CONFIG_PATH: "/app/config/exchange.toml"
      INTERNAL_AUTH_SHARED_SECRET_FILE: "${INTERNAL_AUTH_SHARED_SECRET_FILE:-}"
      INTERNAL_AUTH_SHARED_SECRET: "${INTERNAL_AUTH_SHARED_SECRET:-}"
      SERVER_ROLE_MAPPING_FILE: "${SERVER_ROLE_MAPPING_FILE:-}"
      LEDGER_WAL_PATH: "/app/data/ledger.wal.jsonl"
      SEQUENCER_WAL_PATH: "/app/data/sequencer.wal.jsonl"
      MATCHING_SNAPSHOT_WAL_PATH: "/app/data/matching.snapshot.jsonl"
      TRADE_JOURNAL_WAL_PATH: "/app/data/trade_journal.wal.jsonl"
      TRADE_SETTLEMENT_WAL_PATH: "/app/data/trade_settlement.wal.jsonl"
      INSTRUMENTS_REGISTRY_WAL_PATH: "/app/data/instruments.registry.jsonl"
      FUNDING_RATES_WAL_PATH: "/app/data/funding_rates.jsonl"
      RISK_AUTOMATION_AUDIT_WAL_PATH: "/app/data/risk_automation.audit.jsonl"
      LIQUIDATION_QUEUE_WAL_PATH: "/app/data/liquidation.queue.jsonl"
      LIQUIDATION_AUCTION_WAL_PATH: "/app/data/liquidation.auction.jsonl"
      ADL_GOVERNANCE_WAL_PATH: "/app/data/adl.governance.jsonl"
      LIQUIDATION_POLICY_WAL_PATH: "/app/data/liquidation.policy.jsonl"
      INDEX_PRICE_WAL_PATH: "/app/data/index.price.jsonl"
      INDEX_SOURCE_POLICY_WAL_PATH: "/app/data/index.source.policy.jsonl"
      POSITION_COST_STATE_WAL_PATH: "/app/data/position.cost.state.jsonl"
      POSITION_COST_EVENT_WAL_PATH: "/app/data/position.cost.events.jsonl"
      GOVERNANCE_ACTION_WAL_PATH: "/app/data/governance.actions.jsonl"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/ready"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  exchange-data:
