apiVersion: v1
kind: Namespace
metadata:
  name: exchange
  labels:
    app.kubernetes.io/part-of: rust-exchange
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exchange
  namespace: exchange
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: exchange-secrets
  namespace: exchange
type: Opaque
stringData:
  internal_auth.secret: "deployment-acceptance-secret-32-bytes!!"
  role_mapping.json: |
    {
      "admin": "admin",
      "bench-admin": "admin"
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exchange-data
  namespace: exchange
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange
  namespace: exchange
  labels:
    app: exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exchange
  template:
    metadata:
      labels:
        app: exchange
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3030"
        prometheus.io/path: "/metrics/prometheus"
    spec:
      automountServiceAccountToken: false
      serviceAccountName: exchange
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exchange
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3030
              protocol: TCP
          env:
            - name: RUST_LOG
              value: info
            - name: API_BIND_HOST
              value: 0.0.0.0
            - name: API_BIND_PORT
              value: "3030"
            - name: WS_MAX_CONNECTIONS
              value: "1024"
            - name: INTERNAL_AUTH_SHARED_SECRET_FILE
              value: /var/run/secrets/exchange/internal_auth.secret
            - name: SERVER_ROLE_MAPPING_FILE
              value: /var/run/secrets/exchange/role_mapping.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: auth-secret
              mountPath: /var/run/secrets/exchange
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: exchange-data
        - name: auth-secret
          secret:
            secretName: exchange-secrets
            items:
              - key: internal_auth.secret
                path: internal_auth.secret
              - key: role_mapping.json
                path: role_mapping.json
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: exchange
  namespace: exchange
  labels:
    app: exchange
spec:
  type: NodePort
  ports:
    - name: http
      port: 3030
      targetPort: http
      protocol: TCP
      nodePort: 30030
  selector:
    app: exchange
