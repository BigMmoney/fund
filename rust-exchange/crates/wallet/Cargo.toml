[package]
name = "wallet"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
persistence = { path = "../persistence" }
# P0-SEC-6 / P0-FUND-1: feature-gated HTTP client. `blocking` keeps
# the SanctionsProvider trait sync (no async runtime requirement).
ureq = { version = "2.10", features = ["json", "tls"], optional = true }

[features]
default = []
# P0-FUND-1: real ETH chain adapter behind a feature flag. Read-side
# (balance / confirmations) talks JSON-RPC over HTTPS via ureq.
# Signing + broadcast remain stubbed until the KMS-sealed key + RPC
# URL are provisioned.
eth-rpc = ["dep:ureq"]
# P0-SEC-6: real Chainalysis sanctions provider behind a feature flag.
# Hits public.chainalysis.com/api/v1/address/{addr}; treats network
# failures as `SanctionsScreenStatus::Error` (soft block).
chainalysis = ["dep:ureq"]
