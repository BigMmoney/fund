[package]
name = "api"
version.workspace = true
edition.workspace = true

[dependencies]
types = { path = "../types" }
eventbus = { path = "../eventbus" }
instruments = { path = "../instruments" }
ledger = { path = "../ledger" }
matching = { path = "../matching" }
persistence = { path = "../persistence" }
projections = { path = "../projections" }
risk = { path = "../risk" }
sequencer = { path = "../sequencer" }
wallet = { path = "../wallet" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
warp.workspace = true
anyhow.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
uuid.workspace = true
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
futures-util = "0.3"
# Used by `/binance/rest/*` proxy route (browser-side fallback for users
# behind firewalls or with browser extensions that block fetches direct
# to data-api.binance.vision). Same crate already pulled in via wallet.
ureq = { version = "2.10", features = ["tls"] }

# P1-OPS-2: OpenTelemetry stack is feature-gated to keep default build
# fast. Enable with `--features otel`; activate at runtime by setting
# `OTEL_EXPORTER_OTLP_ENDPOINT`. Without the env var, the OTel layer is
# constructed but exports nothing (no-op exporter).
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

[features]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dev-dependencies]
proptest = "1.5"
tempfile = "3.14"
criterion = "0.5"
tokio = { workspace = true, features = ["rt-multi-thread"] }

[[bench]]
name = "order_pipeline_benchmark"
harness = false
