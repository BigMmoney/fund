name: Rust CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "rust-exchange/**"
  push:
    branches: ["main"]
    paths:
      - "rust-exchange/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: rust-exchange

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-exchange
      # `--locked` enforces that Cargo.lock matches what's committed —
      # P1-CI-1 acceptance: intentional Cargo.lock drift fails the build.
      - run: cargo check --workspace --all-targets --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-exchange
      # P1-CI-2 acceptance: workspace test suite is the PR gate.
      - run: cargo test --workspace --no-fail-fast --locked
        env:
          RUST_LOG: error

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-exchange
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: cargo audit (dependency security)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-exchange
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Scan for known vulnerabilities
        run: cargo audit --deny warnings
        working-directory: rust-exchange

  guardrails:
    name: critical guardrails
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-exchange
      - run: cargo test -p api config::tests -- --nocapture
      - run: cargo test -p api websocket::tests::bridge_publishes_balance_updates_for_ledger_commits -- --nocapture
      - run: python scripts/run_recovery_drill.py --output recovery_drill_report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-drill-report
          path: rust-exchange/recovery_drill_report.json

  benchmark-guardrails:
    name: benchmark guardrails
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-exchange
      - name: Run end-to-end benchmark guardrails
        shell: pwsh
        run: >
          ./scripts/run_backend_resilience_benchmarks.ps1
          -Ci
          -HttpBenchClient go
          -GoDisableKeepAlives:$false
          -ScaleLadder
          -LatencySamples 1000
          -Concurrency 16
          -WarmDepthOrders 24
          -FaultCycles 0
          -SoakSeconds 0
          -SoakBurstSize 0
          -FailOnRegression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-resilience-artifacts
          path: rust-exchange/artifacts/backend-resilience/**/reports/*
